<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Free Fire Clone</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #ui {
            position: absolute; bottom: 20px; left: 20px; color: white;
            text-shadow: 2px 2px 4px #000; pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; transform: translate(-50%, -50%);
        }
        #health-bar {
            width: 200px; height: 10px; background: rgba(0,0,0,0.5);
            border: 2px solid white; margin-top: 5px;
        }
        #health-inner { width: 100%; height: 100%; background: #4CAF50; transition: 0.3s; }
        .instructions { position: absolute; top: 10px; right: 10px; color: #fff; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div id="crosshair"></div>
<div id="ui">
    <div style="font-size: 24px; font-weight: bold;">JUGADOR</div>
    <div id="health-bar"><div id="health-inner"></div></div>
    <p>Kills: <span id="kills">0</span> | Loot: <span id="loot">0</span></p>
</div>
<div class="instructions">
    WASD: Mover | CLICK: Disparar | E: Agarrar | ESPACIO: Saltar
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// --- CONFIGURACIÓN DE ESCENA ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // Cielo
scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- LUCES ---
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 20, 10);
light.castShadow = true;
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

// --- SUELO (EL MAPA) ---
const floorGeo = new THREE.PlaneGeometry(200, 200);
const floorMat = new THREE.MeshPhongMaterial({ color: 0x3d5229 }); // Verde militar
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// --- JUGADOR (Mecánica de 3ra Persona) ---
const playerGroup = new THREE.Group();
const bodyGeo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
const bodyMat = new THREE.MeshPhongMaterial({ color: 0x2244aa });
const playerMesh = new THREE.Mesh(bodyGeo, bodyMat);
playerMesh.castShadow = true;
playerMesh.position.y = 1;
playerGroup.add(playerMesh);
scene.add(playerGroup);

// La cámara sigue al jugador
const cameraOffset = new THREE.Vector3(0, 3, 5);

// --- OBJETOS (CASAS Y LOOT) ---
function createHouse(x, z) {
    const house = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(5, 4, 5), new THREE.MeshPhongMaterial({color: 0x8b4513}));
    base.position.y = 2;
    base.castShadow = true;
    house.add(base);
    house.position.set(x, 0, z);
    scene.add(house);
    return base;
}
const houses = [createHouse(10, -10), createHouse(-15, -20)];

const loots = [];
function spawnLoot() {
    const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
    const mat = new THREE.MeshPhongMaterial({color: 0xffd700, emissive: 0x333300});
    const box = new THREE.Mesh(geo, mat);
    box.position.set(Math.random()*40-20, 0.5, Math.random()*40-20);
    scene.add(box);
    loots.push(box);
}
for(let i=0; i<10; i++) spawnLoot();

// --- ENEMIGOS (BOTS) ---
const enemies = [];
function spawnEnemy() {
    const en = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1, 4, 8), new THREE.MeshPhongMaterial({color: 0xff0000}));
    en.position.set(Math.random()*60-30, 1, Math.random()*60-30);
    scene.add(en);
    enemies.push({mesh: en, hp: 100});
}
for(let i=0; i<5; i++) spawnEnemy();

// --- LÓGICA DE JUEGO ---
let kills = 0;
let lootCount = 0;
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Disparo
window.addEventListener('mousedown', () => {
    // Simulación de disparo simple
    const raycaster = new THREE.Raycaster();
    const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
    raycaster.set(playerGroup.position, direction);
    
    const intersects = raycaster.intersectObjects(enemies.map(e => e.mesh));
    if(intersects.length > 0) {
        const hit = enemies.find(e => e.mesh === intersects[0].object);
        hit.hp -= 50;
        if(hit.hp <= 0) {
            scene.remove(hit.mesh);
            enemies.splice(enemies.indexOf(hit), 1);
            kills++;
            document.getElementById('kills').innerText = kills;
            spawnEnemy(); // Reaparece otro
        }
    }
});

function update() {
    // Movimiento
    const speed = 0.15;
    if(keys['KeyW']) playerGroup.translateZ(-speed);
    if(keys['KeyS']) playerGroup.translateZ(speed);
    if(keys['KeyA']) playerGroup.rotation.y += 0.05;
    if(keys['KeyD']) playerGroup.rotation.y -= 0.05;
    if(keys['Space'] && playerGroup.position.y <= 0.1) playerGroup.position.y += 2; // Salto simple

    // Gravedad
    if(playerGroup.position.y > 0) playerGroup.position.y -= 0.05;

    // Recoger Loot
    loots.forEach((l, i) => {
        if(playerGroup.position.distanceTo(l.position) < 1.5) {
            if(keys['KeyE']) {
                scene.remove(l);
                loots.splice(i, 1);
                lootCount++;
                document.getElementById('loot').innerText = lootCount;
            }
        }
    });

    // IA Enemigos básica
    enemies.forEach(en => {
        en.mesh.lookAt(playerGroup.position);
        en.mesh.translateZ(0.02);
    });

    // Actualizar cámara (Tercera persona)
    const relativeCameraOffset = new THREE.Vector3(0, 3, 6);
    const cameraOffset = relativeCameraOffset.applyMatrix4(playerGroup.matrixWorld);
    camera.position.x = cameraOffset.x;
    camera.position.y = cameraOffset.y;
    camera.position.z = cameraOffset.z;
    camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);
}

function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

animate();

// Ajuste de ventana
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
