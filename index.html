<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Survival Index Shooter</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        canvas { background: #2d2d2d; border: 4px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 20px; left: 20px; color: white; user-select: none; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <div>Puntos: <span id="score">0</span></div>
        <div>Loot: <span id="loot">0</span></div>
        <div style="margin-top: 10px; font-size: 12px; opacity: 0.7;">WASD: Mover | CLICK: Disparar | E: Recoger</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const lootEl = document.getElementById("loot");

canvas.width = 800;
canvas.height = 600;

// Estado del juego
let score = 0;
let lootCount = 0;
const keys = {};
const bullets = [];
const enemies = [];
const loots = [];
const particles = [];
const houses = [
    {x: 150, y: 150, w: 120, h: 100},
    {x: 550, y: 350, w: 150, h: 120}
];

const player = {
    x: 400, y: 300, size: 25, speed: 4, color: "#4CAF50"
};

// Controles
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
window.addEventListener("mousedown", spawnBullet);

function spawnBullet(e) {
    const rect = canvas.getBoundingClientRect();
    const targetX = e.clientX - rect.left;
    const targetY = e.clientY - rect.top;
    const angle = Math.atan2(targetY - player.y, targetX - player.x);
    
    bullets.push({
        x: player.x, y: player.y,
        vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8,
        size: 5
    });
}

function spawnEnemy() {
    if (enemies.length < 6) {
        enemies.push({
            x: Math.random() < 0.5 ? 0 : canvas.width,
            y: Math.random() * canvas.height,
            size: 25, speed: 1.5 + Math.random(),
            hp: 2
        });
    }
}

function spawnLoot() {
    if (loots.length < 4) {
        loots.push({ x: Math.random() * 700 + 50, y: Math.random() * 500 + 50, size: 15 });
    }
}

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.w && rect1.x + rect1.w > rect2.x &&
           rect1.y < rect2.y + rect2.h && rect1.y + rect1.h > rect2.y;
}

function update() {
    // Movimiento con colisión de "casas"
    let nextX = player.x;
    let nextY = player.y;

    if (keys['w']) nextY -= player.speed;
    if (keys['s']) nextY += player.speed;
    if (keys['a']) nextX -= player.speed;
    if (keys['d']) nextX += player.speed;

    const playerBox = { x: nextX - 12, y: nextY - 12, w: 25, h: 25 };
    let collision = false;
    houses.forEach(h => { if (checkCollision(playerBox, h)) collision = true; });

    if (!collision) {
        player.x = nextX;
        player.y = nextY;
    }

    // Acción de agarrar loot (Tecla E)
    if (keys['e']) {
        loots.forEach((l, i) => {
            const dist = Math.hypot(player.x - l.x, player.y - l.y);
            if (dist < 30) {
                loots.splice(i, 1);
                lootCount++;
                lootEl.innerText = lootCount;
            }
        });
    }

    // IA de los Bots (Enemigos)
    enemies.forEach((en, i) => {
        const angle = Math.atan2(player.y - en.y, player.x - en.x);
        en.x += Math.cos(angle) * en.speed;
        en.y += Math.sin(angle) * en.speed;

        // Colisión bala-enemigo
        bullets.forEach((b, bi) => {
            if (Math.hypot(en.x - b.x, en.y - b.y) < en.size) {
                en.hp--;
                bullets.splice(bi, 1);
                if (en.hp <= 0) {
                    enemies.splice(i, 1);
                    score += 100;
                    scoreEl.innerText = score;
                }
            }
        });
    });

    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dibujar Casas
    ctx.fillStyle = "#5d4037";
    ctx.shadowBlur = 10; ctx.shadowColor = "black";
    houses.forEach(h => ctx.fillRect(h.x, h.y, h.w, h.h));
    ctx.shadowBlur = 0;

    // Dibujar Loot
    ctx.fillStyle = "#FFD700";
    loots.forEach(l => {
        ctx.beginPath();
        ctx.arc(l.x, l.y, l.size/2, 0, Math.PI*2);
        ctx.fill();
    });

    // Dibujar Balas
    ctx.fillStyle = "yellow";
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.size, b.size));

    // Dibujar Enemigos (Bots)
    ctx.fillStyle = "#ff5252";
    enemies.forEach(en => {
        ctx.save();
        ctx.translate(en.x, en.y);
        ctx.fillRect(-12, -12, 25, 25);
        ctx.restore();
    });

    // Dibujar Jugador
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size/2, 0, Math.PI*2);
    ctx.fill();
}

function gameLoop() {
    update();
    draw();
    if (Math.random() < 0.02) spawnEnemy();
    if (Math.random() < 0.005) spawnLoot();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
